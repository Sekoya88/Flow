services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - flow_qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    ports:
      # Host 16379 avoids clash with another Redis or tool already bound to :6379 on the machine.
      - "16379:6379"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - "55432:5432"
    volumes:
      - flow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 3s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - .env
    tty: true
    stdin_open: true
    environment:
      PYTHONUNBUFFERED: "1"
      FLOW_DATABASE_URL: postgresql://flow:flow@db:5432/flow
      FLOW_JWT_SECRET: dev-insecure-change-in-prod-use-openssl-rand-hex-32
      FLOW_OPENAI_API_KEY: ${FLOW_OPENAI_API_KEY:-}
      FLOW_ANTHROPIC_API_KEY: ${FLOW_ANTHROPIC_API_KEY:-}
      # Browser origin is the host port you open (see web ports). Include :3000 for local `npm run dev`.
      FLOW_CORS_ORIGINS: http://localhost:13000,http://localhost:3000,http://web:3000
      FLOW_LOG_LEVEL: INFO
      FLOW_LOG_JSON: "true"
      FLOW_LOG_FORCE_COLORS: "false"
      FLOW_REDIS_URL: redis://redis:6379/0
      FLOW_QDRANT_URL: http://qdrant:6333
      FLOW_QDRANT_COLLECTION: flow_knowledge
      FLOW_AGENTIC_RAG_ENABLED: "true"
      FLOW_TAVILY_API_KEY: ${FLOW_TAVILY_API_KEY:-}
      FLOW_LANGSMITH_TRACING: ${FLOW_LANGSMITH_TRACING:-true}
      FLOW_LANGSMITH_API_KEY: ${FLOW_LANGSMITH_API_KEY:-}
      FLOW_LANGSMITH_PROJECT: ${FLOW_LANGSMITH_PROJECT:-flow-docker}
      FLOW_LANGSMITH_ENDPOINT: ${FLOW_LANGSMITH_ENDPOINT:-}
    volumes:
      - "${FLOW_OBSIDIAN_VAULT_PATH:-/tmp/obsidian-vault}:/vault"
    ports:
      # Host 18000 avoids clash with another process already bound to 8000 (e.g. local uvicorn).
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    build:
      context: ./services/api
    env_file:
      - .env
    tty: true
    stdin_open: true
    command: ["uv", "run", "arq", "flow.infrastructure.queue.worker.WorkerSettings"]
    environment:
      PYTHONUNBUFFERED: "1"
      FLOW_DATABASE_URL: postgresql://flow:flow@db:5432/flow
      FLOW_JWT_SECRET: dev-insecure-change-in-prod-use-openssl-rand-hex-32
      FLOW_OPENAI_API_KEY: ${FLOW_OPENAI_API_KEY:-}
      FLOW_ANTHROPIC_API_KEY: ${FLOW_ANTHROPIC_API_KEY:-}
      FLOW_LOG_LEVEL: INFO
      FLOW_LOG_JSON: "true"
      FLOW_LOG_FORCE_COLORS: "false"
      FLOW_REDIS_URL: redis://redis:6379/0
      FLOW_QDRANT_URL: http://qdrant:6333
      FLOW_QDRANT_COLLECTION: flow_knowledge
      FLOW_AGENTIC_RAG_ENABLED: "true"
      FLOW_TAVILY_API_KEY: ${FLOW_TAVILY_API_KEY:-}
      FLOW_LANGSMITH_TRACING: ${FLOW_LANGSMITH_TRACING:-true}
      FLOW_LANGSMITH_API_KEY: ${FLOW_LANGSMITH_API_KEY:-}
      FLOW_LANGSMITH_PROJECT: ${FLOW_LANGSMITH_PROJECT:-flow-docker}
      FLOW_LANGSMITH_ENDPOINT: ${FLOW_LANGSMITH_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - "${FLOW_OBSIDIAN_VAULT_PATH:-/tmp/obsidian-vault}:/vault"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FLOW_API_URL: http://localhost:18000
    environment:
      NEXT_PUBLIC_FLOW_API_URL: http://localhost:18000
    ports:
      # Host 13000 → container 3000 (Next listens on 3000 inside the image). Avoids clash with another app on host :3000.
      - "13000:3000"
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  mcp:
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FLOW_API_URL: http://api:8000
      FLOW_JWT_SECRET: dev-insecure-change-in-prod-use-openssl-rand-hex-32
      FLOW_GITHUB_TOKEN: ${FLOW_GITHUB_TOKEN:-}
      FLOW_TAVILY_API_KEY: ${FLOW_TAVILY_API_KEY:-}
      FLOW_OBSIDIAN_MODE: filesystem
      FLOW_OBSIDIAN_VAULT_PATH: /vault
      FLOW_MINIO_ENDPOINT: minio:9000
      FLOW_MINIO_ACCESS_KEY: ${FLOW_MINIO_ACCESS_KEY:-minioadmin}
      FLOW_MINIO_SECRET_KEY: ${FLOW_MINIO_SECRET_KEY:-minioadmin}
      FLOW_MINIO_BUCKET: ${FLOW_MINIO_BUCKET:-flow-obsidian}
    ports:
      - "18001:8001"
    volumes:
      - flow_vault_data:/vault
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FLOW_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${FLOW_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - flow_minio_data:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  flow_pgdata:
  flow_qdrant_data:
  flow_vault_data:
  flow_minio_data:
