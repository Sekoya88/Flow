[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "exec 2>&1 && echo DIAG_PORT=$PORT && ls /app/.venv/bin/python && /app/.venv/bin/python -c \"print('DIAG_PY_OK')\" && /app/.venv/bin/python -c \"import flow.interfaces.http.main; print('DIAG_IMPORT_OK')\" && echo DIAG_STARTING_UVICORN && /app/.venv/bin/uvicorn flow.interfaces.http.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
