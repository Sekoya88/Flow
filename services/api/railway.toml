[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "echo DIAG_START_PORT=$PORT && /app/.venv/bin/python -c 'print(\"DIAG_PY_OK\")' 2>&1 && echo DIAG_IMPORTING && /app/.venv/bin/python -c 'import flow.interfaces.http.main; print(\"DIAG_IMPORT_OK\")' 2>&1 ; echo DIAG_IMPORT_EXIT=$? && /app/.venv/bin/uvicorn flow.interfaces.http.main:app --host 0.0.0.0 --port $PORT 2>&1"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
