[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-api"
version = "0.1.0"
description = "Flow platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "asyncpg>=0.30,<1",
  "structlog>=24.4,<26",
  "langgraph>=0.6,<2",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "openai>=1.50,<2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "python-jose[cryptography]>=3.3,<4",
  "bcrypt>=4.2,<5",
  "httpx>=0.27,<1",
  "python-louvain>=0.16,<1",
  "python-multipart>=0.0.9",
  "email-validator>=2,<3",
  "alembic>=1.18.4",
  "opentelemetry-sdk>=1.41.1",
  "opentelemetry-instrumentation-fastapi>=0.62b1",
  "opentelemetry-instrumentation-asyncpg>=0.62b1",
  "opentelemetry-instrumentation-httpx>=0.62b1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
  "sentry-sdk[fastapi]>=2.58.0",
  "prometheus-fastapi-instrumentator>=7.1.0",
  "arq>=0.28.0",
  "tenacity>=8.0,<10",
  "tiktoken>=0.7,<1",
  "redis>=5.3.1",
  "langchain-anthropic>=0.3.22",
  "langchain-ollama>=0.3.10",
  "networkx>=3.3,<4",
  "e2b-code-interpreter>=2.6.0",
  "qdrant-client>=1.12,<2",
  "fastembed>=0.4,<1",
  "tavily-python>=0.5,<1",
  "pymupdf>=1.24,<2",
  "pypdf>=4.0,<6",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["flow"]

[tool.hatch.build.targets.wheel.force-include]
"flow/infrastructure/db/schema.sql" = "flow/infrastructure/db/schema.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# LangSmith must run before any LangChain/LangGraph import chain (arq/worker imports).
"flow/infrastructure/queue/worker.py" = ["E402"]
